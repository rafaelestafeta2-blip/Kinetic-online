name: Build Native Android APK & Play Store AAB (Capacitor + WebGL GPU)

on:
  push:
    branches: [ main, master, 'cursor/**' ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK / AAB Nativo Android (KINETIC FPS)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar Java JDK 21 (Requisito Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 5. Instalar Dependências e Compilar Web App (Vite Production Build)
        env:
          VITE_WS_SERVER_URL: ${{ secrets.VITE_WS_SERVER_URL || 'wss://gamefps-multiplayer.onrender.com/ws' }}
          VITE_ASSET_CDN_URL: ${{ secrets.VITE_ASSET_CDN_URL || '' }}
        run: |
          npm ci || npm install
          npm run build
          if [ -n "$VITE_ASSET_CDN_URL" ]; then
            echo ">>> CDN ativa ($VITE_ASSET_CDN_URL): removendo models/maps pesados de dist/ para gerar APK leve..."
            rm -rf dist/models dist/maps
          fi

      - name: 6. Gerar e Sincronizar Plataforma Nativa Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Patch Android (OAuth + Voice Chat Mic + Release Signing + GPU/Haptics)
        run: |
          node scripts/patch-android-manifest.js

      - name: 8. Configurar Espelhos Gradle e Compilar APK Debug (Teste Rápido)
        working-directory: ./android
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirrors.gradle
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  google()
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  maven { url = uri("https://repo1.maven.org/maven2/") }
              }
              project.repositories {
                  google()
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  maven { url = uri("https://repo1.maven.org/maven2/") }
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Publicar APK Debug nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: KINETIC-Tactical-FPS-Android-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 10. Verificar se Keystore Release da Play Store está configurada
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "ℹ️ Keystore Release não configurada — mantendo apenas APK Debug."
          fi

      - name: 11. Compilar Release Assinado (APK + AAB Google Play) se Keystore configurada
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KINETIC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINETIC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINETIC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          export KINETIC_KEYSTORE_PATH="$(pwd)/app/release-keystore.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          rm -f app/release-keystore.jks

      - name: 12. Publicar Release Assinado (Play Store AAB + APK)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KINETIC-Tactical-FPS-PlayStore-Release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
