name: Build Native Android APK (Capacitor + WebGL GPU)

on:
  push:
    branches: [ main, master, 'cursor/**' ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK Nativo Android (KINETIC FPS)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar Java JDK 21 (Requisito Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 5. Instalar Dependências e Compilar Web App (Vite Production Build)
        env:
          VITE_WS_SERVER_URL: ${{ secrets.VITE_WS_SERVER_URL || 'wss://gamefps-multiplayer.onrender.com/ws' }}
        run: |
          npm ci || npm install
          npm run build

      - name: 6. Gerar e Sincronizar Plataforma Nativa Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Patch Android (singleTask + GoogleOAuthActivity + landscape/GPU/haptics)
        run: |
          node scripts/patch-android-manifest.js

      - name: 8. Compilar APK Nativo via Gradle (assembleDebug)
        working-directory: ./android
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirrors.gradle
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  google()
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  maven { url = uri("https://repo1.maven.org/maven2/") }
              }
              project.repositories {
                  google()
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  maven { url = uri("https://repo1.maven.org/maven2/") }
              }
          }
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Publicar APK nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: KINETIC-Tactical-FPS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
